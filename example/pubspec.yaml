name: monokit_example
description: The Monokit showcase — a self-documenting widget gallery with full-fidelity product scenarios.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  monokit_ui:
    path: ../
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/products/
    - assets/images/media/
    - assets/images/scenarios/
