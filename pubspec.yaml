name: monokit_ui
description: "A token-driven, widgets-first Flutter design system: light and dark themes, forms, overlays and app shells, built on widgets rather than Material."
version: 4.7.0
repository: https://github.com/monorithm/monokit-ui
issue_tracker: https://github.com/monorithm/monokit-ui/issues
topics:
  - design-system
  - design-tokens
  - widgets
  - theme
  - ui

environment:
  # The floor CI proves, not the floor the widgets would tolerate. `sdk:
  # ^3.12.2` already excludes every Flutter below the 3.44 line -- 3.44.8 is
  # the release that ships Dart 3.12.2 -- so the ">=3.35.0" this used to claim
  # was never reachable. Lowering a floor later is safe for consumers; raising
  # one is breaking, which is why it is worth being honest about now, before
  # there is a published version to break.
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The IBM Plex superfamily is bundled with the library (the canonical
  # Monokit type). Reference it from code as `packages/monokit_ui/IBM Plex Sans`
  # (this is what MonokitTypography.plex() does). Plex Sans is a variable font;
  # the wght axis is selected via TextStyle.fontWeight.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans.ttf
    # IBM Plex Sans carries no Arabic — Arabic is a separate family in the
    # superfamily, not a subset of the Latin one. Without this an Arabic string
    # silently falls back to whatever the platform offers, at different metrics
    # and a different colour, which is a visible break in a product that ships
    # Arabic as one of five languages. `MonokitTypography` lists it as the
    # fallback, so nothing at a call site has to know it exists.
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: fonts/IBMPlexSansArabic-Regular.ttf
        - asset: fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: IBM Plex Serif
      fonts:
        - asset: fonts/IBMPlexSerif-Regular.ttf
        - asset: fonts/IBMPlexSerif-SemiBold.ttf
          weight: 600
