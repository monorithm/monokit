name: monokit
description: A compact, token-driven, widgets-first Flutter design system for Monorithm.
version: 0.9.0
homepage: https://github.com/monorithm/monokit
repository: https://github.com/monorithm/monokit
topics:
  - design-system
  - widgets
  - ui

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The IBM Plex superfamily is bundled with the library (the canonical
  # Monokit type). Reference it from code as `packages/monokit/IBM Plex Sans`
  # (this is what MonokitTypography.plex() does). Plex Sans is a variable font;
  # the wght axis is selected via TextStyle.fontWeight.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: IBM Plex Serif
      fonts:
        - asset: fonts/IBMPlexSerif-Regular.ttf
        - asset: fonts/IBMPlexSerif-SemiBold.ttf
          weight: 600
